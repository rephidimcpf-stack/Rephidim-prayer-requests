<style>

  :root {
    --bg: #0b0d18;
    --surface: rgba(30, 33, 60, 0.72);
    --surface-solid: #1e2133;
    --ink: #f4f5ff;
    --muted: #9aa3cf;
    --brand: #8b7cf7;
    --brand2: #a78bfa;
    --gold: #f6c66b;
    --gold2: #ffe0a3;
    --stop: #ef5b5b;
    --stop-soft: rgba(239, 91, 91, 0.22);
    --ok: #34d399;
    --line: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif Telugu', 'Suranna', system-ui, -apple-system, 'Segoe UI', Roboto, serif;
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior-y: none;
    background:
      radial-gradient(ellipse 90% 55% at 50% -12%, rgba(139, 124, 247, 0.30) 0%, transparent 58%),
      radial-gradient(ellipse 70% 45% at 88% 108%, rgba(246, 198, 107, 0.14) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 6% 92%, rgba(52, 211, 153, 0.10) 0%, transparent 55%),
      linear-gradient(180deg, #0b0d18 0%, #0e1024 55%, #0a0c16 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* drifting ambient orbs */
  .bg-orbs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
  .orb-1 { width: 320px; height: 320px; top: -80px; left: -70px; background: rgba(139, 124, 247, 0.55); animation: drift1 16s ease-in-out infinite alternate; }
  .orb-2 { width: 260px; height: 260px; bottom: -70px; right: -60px; background: rgba(246, 198, 107, 0.32); animation: drift2 19s ease-in-out infinite alternate; }
  .orb-3 { width: 220px; height: 220px; top: 45%; right: -80px; background: rgba(52, 211, 153, 0.22); animation: drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(40px, 60px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-46px, -40px) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-30px, 40px) scale(1.15); } }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 18px 14px;
    padding: 34px 22px calc(44px + env(safe-area-inset-bottom));
    text-align: center;
    border-radius: 30px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  header { margin-bottom: 30px; }

  .logo-wrap { position: relative; width: 124px; height: 124px; margin: 0 auto 16px; }
  .logo {
    position: relative;
    z-index: 2;
    width: 124px;
    height: 124px;
    border-radius: 26px;
    display: block;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(139, 124, 247, 0.22);
    animation: bob 5s ease-in-out infinite;
  }
  .logo-halo {
    position: absolute;
    inset: -16px;
    border-radius: 38px;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.42) 0%, transparent 70%);
    animation: haloPulse 3.4s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes haloPulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.18); opacity: 0.28; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  h1 {
    font-family: 'Suranna', 'Noto Serif Telugu', serif;
    font-size: clamp(26px, 8.5vw, 42px);
    font-weight: 400;
    margin: 2px 0 4px;
    letter-spacing: 0.03em;
    background: linear-gradient(100deg, #ffffff 8%, var(--gold2) 38%, var(--brand2) 62%, #ffffff 92%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 7s linear infinite;
  }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }

  .step { padding: 4px 0; }
  .step:not(.hidden) { animation: stepIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes stepIn { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }

  /* BIG glowing mic button */
  .mic-btn {
    position: relative;
    width: 198px;
    height: 198px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 14px auto 18px;
    background:
      radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.38), transparent 46%),
      linear-gradient(150deg, var(--brand2), var(--brand) 58%, #6d5ce0);
    box-shadow:
      0 20px 46px rgba(109, 92, 224, 0.5),
      0 0 0 8px rgba(139, 124, 247, 0.10),
      inset 0 -6px 18px rgba(0, 0, 0, 0.18);
    transition: transform 0.18s ease, box-shadow 0.25s ease;
  }
  .mic-btn::before,
  .mic-btn::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .mic-btn::before { inset: -14px; border: 2px solid rgba(167, 139, 250, 0.30); animation: ringPulse 2.6s ease-in-out infinite; }
  .mic-btn::after { inset: -28px; border: 1px solid rgba(167, 139, 250, 0.14); animation: ringPulse 2.6s ease-in-out infinite 0.5s; }
  .mic-btn:active { transform: scale(0.95); box-shadow: 0 8px 22px rgba(109, 92, 224, 0.4); }
  .mic-icon { display: inline-flex; line-height: 0; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.25)); animation: bob 3s ease-in-out infinite; }
  .circle-btn svg { display: block; }
  .mic-label { font-size: 17px; font-weight: 600; letter-spacing: 0.03em; }
  @keyframes ringPulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.09); opacity: 0.16; } }

  .hint { color: var(--muted); font-size: 14px; margin: 0 auto; max-width: 270px; }

  /* Recording */
  .rec-ring {
    position: relative;
    width: 172px;
    height: 172px;
    border-radius: 50%;
    margin: 8px auto 4px;
    background: radial-gradient(circle, var(--stop-soft), transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 1.7s ease-in-out infinite;
  }
  .rec-dot { width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(150deg, #ff8a8a, var(--stop)); box-shadow: 0 6px 20px rgba(239, 91, 91, 0.55); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 91, 91, 0.45); } 50% { box-shadow: 0 0 0 26px rgba(239, 91, 91, 0); } }

  .wave { display: flex; align-items: center; justify-content: center; gap: 6px; height: 54px; margin: 4px 0 2px; }
  .wave span { width: 6px; border-radius: 6px; background: linear-gradient(180deg, var(--brand2), var(--gold)); transform-origin: center; animation: barDance 1s ease-in-out infinite; }
  .wave span:nth-child(1) { height: 16px; animation-delay: 0s; }
  .wave span:nth-child(2) { height: 30px; animation-delay: 0.12s; }
  .wave span:nth-child(3) { height: 44px; animation-delay: 0.24s; }
  .wave span:nth-child(4) { height: 24px; animation-delay: 0.36s; }
  .wave span:nth-child(5) { height: 50px; animation-delay: 0.06s; }
  .wave span:nth-child(6) { height: 28px; animation-delay: 0.3s; }
  .wave span:nth-child(7) { height: 40px; animation-delay: 0.18s; }
  .wave span:nth-child(8) { height: 22px; animation-delay: 0.42s; }
  .wave span:nth-child(9) { height: 34px; animation-delay: 0.09s; }
  @keyframes barDance { 0%, 100% { transform: scaleY(0.42); } 50% { transform: scaleY(1.15); } }

  .timer {
    font-size: 40px;
    font-weight: 600;
    margin: 8px 0 4px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    transition: color 0.3s ease, text-shadow 0.3s ease;
    text-shadow: 0 0 22px rgba(139, 124, 247, 0.5);
  }
  .timer.warn { color: #fbbf24; text-shadow: 0 0 22px rgba(251, 191, 36, 0.5); }

  .review-title { margin: 6px 0 0; font-size: 16px; color: var(--muted); letter-spacing: 0.04em; }

  /* Big circular action buttons */
  .circle-btn {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto;
    color: #fff;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .circle-btn:active { transform: scale(0.92); }

  .circle-stop {
    background: linear-gradient(150deg, #ff8a8a, var(--stop));
    width: 100px;
    height: 100px;
    font-size: 30px;
    margin-top: 18px;
    box-shadow: 0 12px 30px rgba(239, 91, 91, 0.45);
  }
  .circle-send { background: linear-gradient(150deg, #6ee7b7, var(--ok)); box-shadow: 0 12px 30px rgba(52, 211, 153, 0.42); }
  .circle-again { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }

  .action-row { display: flex; justify-content: center; gap: 38px; margin-top: 26px; }
  .action-row .label { font-size: 14px; color: var(--muted); margin-top: 10px; font-weight: 500; }
  .action-col { display: flex; flex-direction: column; align-items: center; }

  audio { width: 100%; max-width: 100%; margin: 16px auto 6px; display: block; border-radius: 16px; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35)); }

  /* Sending */
  .spinner {
    position: relative;
    width: 64px;
    height: 64px;
    margin: 52px auto 22px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.08);
    border-top-color: var(--brand2);
    animation: spin 0.9s linear infinite;
  }
  .spinner::after { content: ''; position: absolute; inset: 8px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.06); border-bottom-color: var(--gold); animation: spin 1.4s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Done */
  .emoji.big { font-size: 86px; margin: 26px 0 10px; animation: pop-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both, glow 2.4s ease-in-out infinite 0.5s; }
  @keyframes pop-in { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(246, 198, 107, 0)); } 50% { filter: drop-shadow(0 0 26px rgba(246, 198, 107, 0.55)); } }
  .done-title { margin: 0; font-size: 20px; color: var(--gold2); letter-spacing: 0.05em; }

  /* Optional type section */
  .more { margin: 40px auto 0; max-width: 310px; text-align: left; border-top: 1px solid var(--line); padding-top: 4px; }
  .more summary {
    cursor: pointer;
    padding: 16px 10px;
    color: var(--muted);
    font-size: 16px;
    list-style: none;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 14px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .more summary:active { background: rgba(255, 255, 255, 0.04); }
  .more summary::-webkit-details-marker { display: none; }
  .more summary .write-icon { display: inline-flex; line-height: 0; }
  .more[open] summary { color: var(--ink); }

  .more label { display: block; font-size: 13px; color: var(--muted); margin: 12px 2px 5px; }
  .more input,
  .more textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .more input:focus,
  .more textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(139, 124, 247, 0.2); }
  .more textarea { resize: vertical; min-height: 70px; }

  .err {
    max-width: 310px;
    margin: 18px auto 0;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.3);
    color: #f5e6b8;
    font-size: 14px;
    text-align: left;
    line-height: 1.45;
    animation: stepIn 0.35s ease both;
  }

  .foot { margin-top: 34px; }
  .blessing { margin: 0; font-size: 14.5px; line-height: 1.95; letter-spacing: 0.02em; color: var(--gold2); opacity: 0.92; }

  .help-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; font-size: 13px; color: var(--muted); text-decoration: none; opacity: 0.75; transition: opacity 0.15s ease; }
  .help-link:active { opacity: 1; }

  /* ---- Mobile tuning ---- */
  @media (max-width: 380px) {
    .wrap { padding: 26px 16px calc(36px + env(safe-area-inset-bottom)); border-radius: 26px; }
    .logo, .logo-wrap { width: 108px; height: 108px; }
    .logo { border-radius: 22px; }
    .mic-btn { width: 168px; height: 168px; }
    .mic-icon svg { width: 56px; height: 56px; }
    .rec-ring { width: 150px; height: 150px; }
    .timer { font-size: 34px; }
    .action-row { gap: 28px; }
  }
  @media (max-height: 700px) {

    <button id="btn-stop" class="circle-btn circle-stop" aria-label="ఆపు"><svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"/></svg></button>
  </section>

  <!-- REVIEW -->
  <section id="step-review" class="step hidden">
    <p class="review-title">వినండి</p>
    <audio id="player" controls></audio>
    <div class="action-row">
      <div class="action-col">
        <button id="btn-again" class="circle-btn circle-again" aria-label="మళ్ళీ"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></button>
        <span class="label">మళ్ళీ</span>
      </div>
      <div class="action-col">
        <button id="btn-send" class="circle-btn circle-send" aria-label="పంపు"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
        <span class="label">పంపు</span>
      </div>
    </div>
  </section>

  <!-- SENDING -->
  <section id="step-sending" class="step hidden">
    <div class="spinner"></div>
    <p class="hint">పంపుతోంది…</p>
  </section>

  <!-- DONE -->
  <section id="step-done" class="step hidden">
    <div class="emoji big">🙏</div>
    <p class="done-title">ధన్యవాదాలు</p>
    <button id="btn-new" class="circle-btn circle-again" style="width:70px;height:70px;margin-top:18px;" aria-label="మరొకటి"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <!-- Optional type option -->
  <details class="more">
    <summary>
      <span class="write-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></span>
      <span>టైప్ చేయండి</span>
    </summary>
    <label for="name">పేరు</label>
    <input id="name" type="text" placeholder="పేరు" autocomplete="name">
    <label for="message">రాయండి</label>
    <textarea id="message" rows="3" placeholder="ప్రార్థన…"></textarea>
    <button id="btn-send-text" type="button" class="circle-btn circle-send" style="width:64px;height:64px;margin:16px auto;" aria-label="పంపు"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </details>

  <p id="err" class="err hidden"></p>
  <footer class="foot">
    <p class="blessing">మీ విషయం కొరకు ప్రార్ధన చేస్తాము<br>దేవుడు మిమ్మును దీవించును గాక</p>
  </footer>
</div>

<form id="postForm" method="POST" target="postFrame" action="" style="display:none"
      enctype="application/x-www-form-urlencoded">
  <input type="hidden" name="payload" id="postPayload" value="">
</form>
<iframe name="postFrame" id="postFrame" title="post" style="display:none"></iframe>

<script>
(function () {
  'use strict';

  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjuEH9lcuXd3jdKPwVulpXImb7OwwywjiW3XQhbqsIOOxe6fL6_3v8qt_VF1CbcaU6/exec';

  var MAX_SEC = 90;
  var STEPS = ['step-idle','step-rec','step-review','step-sending','step-done'];

  var mediaRecorder = null, stream = null, chunks = [];
  var audioBlob = null, audioMime = '', startTs = 0, timerId = null, durSec = 0;
  var awaitingPost = false, postTimer = null;
  var lastPayload = null;
  var alreadySent = false;
  var hasSubmitted = false; // hard one-shot: only one POST per recording

  // Remembers the exact text already sent, so the SAME typed request cannot go twice.
  var sentTexts = loadSentTexts();

  function loadSentTexts(){
    try {
      var raw = localStorage.getItem('prarthanaSentTexts');
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveSentTexts(){
    try { localStorage.setItem('prarthanaSentTexts', JSON.stringify(sentTexts)); } catch (e) {}
  }
  function textSignature(name, message){
    return (name || '').replace(/\s+/g, ' ').trim() + '\u0001' +
           (message || '').replace(/\s+/g, ' ').trim();
  }

  function $(id){ return document.getElementById(id); }
  function show(id){
    STEPS.forEach(function(s){ $(s).classList.toggle('hidden', s !== id); });
    window.scrollTo(0, 0);
  }
  function showErr(m){ var e = $('err'); e.textContent = m; e.classList.remove('hidden'); }
  function hideErr(){ $('err').classList.add('hidden'); }
  function fmt(s){ var m = Math.floor(s/60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  function pickMime(){
    var list = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/mpeg'];
    if (!window.MediaRecorder) return '';
    for (var i = 0; i < list.length; i++){
      try { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) {}
    }
    return '';
  }

  function isInAppBrowser(){
    var ua = navigator.userAgent || '';
    return /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|MicroMessenger|Twitter|; wv\)/i.test(ua);
  }

  function micHelp_(err){
    var denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    if (isInAppBrowser()){
      showErr('WhatsApp / Instagram లోపల తెరిచారు. Chrome లేదా Safari లో తెరవండి.');
      return;
    }
    if (denied){
      showErr('మైక్రోఫోన్ అనుమతి లేదు. 🔒 → Microphone → Allow');
      return;
    }
    showErr('మైక్రోఫోన్ పనిచేయడం లేదు. మళ్ళీ ప్రయత్నించండి.');
  }

  function startRecording(){
    hideErr();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      showErr('Chrome లేదా Safari వాడండి.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      audioMime = pickMime();
      try {
        mediaRecorder = audioMime ? new MediaRecorder(stream, { mimeType: audioMime })
                                  : new MediaRecorder(stream);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
        audioMime = '';
      }
      chunks = [];
      mediaRecorder.ondataavailable = function (ev) {
        if (ev.data && ev.data.size > 0) chunks.push(ev.data);
      };
      mediaRecorder.onstop = onRecStop;
      mediaRecorder.start();
      startTs = Date.now();
      $('timer').textContent = '0:00';
      $('timer').classList.remove('warn');
      show('step-rec');
      timerId = setInterval(tick, 250);
    }).catch(function (e) {
      micHelp_(e);
    });
  }

  function tick(){
    var s = Math.floor((Date.now() - startTs) / 1000);
    var timerEl = $('timer');
    timerEl.textContent = fmt(s);
    if (s >= 75) timerEl.classList.add('warn');
    else timerEl.classList.remove('warn');
    if (s >= MAX_SEC) stopRecording();
  }

  function stopRecording(){
    if (timerId){ clearInterval(timerId); timerId = null; }
    durSec = Math.floor((Date.now() - startTs) / 1000);
    try { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } catch (e) {}
    if (stream){ stream.getTracks().forEach(function (t){ t.stop(); }); stream = null; }
  }

  function onRecStop(){
    var type = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType
                                                         : (audioMime || 'audio/webm');
    audioBlob = new Blob(chunks, { type: type });
    audioMime = type;
    if (!audioBlob || audioBlob.size < 1500){
      showErr('రికార్డ్ కాలేదు. మళ్ళీ నొక్కండి.');
      resetAll();
      return;
    }
    var player = $('player');
    player.loop = false;
    player.src = URL.createObjectURL(audioBlob);
    show('step-review');
  }

  function setSendEnabled(on){
    var b1 = $('btn-send');
    var b2 = $('btn-send-text');
    if (b1) { b1.disabled = !on; b1.style.opacity = on ? '1' : '0.5'; b1.style.pointerEvents = on ? 'auto' : 'none'; }
    if (b2) { b2.disabled = !on; b2.style.opacity = on ? '1' : '0.5'; b2.style.pointerEvents = on ? 'auto' : 'none'; }
  }

  function resetAll(){
    hideErr();
    try { if (stream) stream.getTracks().forEach(function (t){ t.stop(); }); } catch (e) {}
    stream = null; mediaRecorder = null; chunks = []; audioBlob = null; durSec = 0;
    lastPayload = null;
    alreadySent = false;
    hasSubmitted = false;
    awaitingPost = false;
    if (postTimer) { clearTimeout(postTimer); postTimer = null; }
    setSendEnabled(true);
    try {
      var p = $('player');
      p.pause();
      p.removeAttribute('src');
      p.load();
    } catch (e) {}
    $('timer').textContent = '0:00';
    $('timer').classList.remove('warn');
    show('step-idle');
  }

  function blobToBase64(blob){
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { var s = r.result; res(s.substring(s.indexOf(',') + 1)); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  function newRequestId(){
    return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function submit(payload){
    // Hard block: only ONE real POST allowed per recording
    if (hasSubmitted) {
      showErr('పంపబడింది');
      return false;
    }
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0){
      showErr('సెటప్ పూర్తికాలేదు.');
      return false;
    }

    hasSubmitted = true;
    alreadySent = true;
    payload.requestId = payload.requestId || newRequestId();
    lastPayload = payload;
    show('step-sending');
    hideErr();
    setSendEnabled(false);

    try { $('player').pause(); } catch (e) {}

    // Single form POST only (reliable with Google Apps Script)
    var form = $('postForm');
    form.action = APPS_SCRIPT_URL;
    $('postPayload').value = JSON.stringify(payload);

    awaitingPost = true;
    if (postTimer) clearTimeout(postTimer);

    // Success path: iframe load
    // Fallback success after 8s if iframe doesn't fire
    postTimer = setTimeout(function () {
      if (awaitingPost) {
        awaitingPost = false;
        show('step-done');
        setTimeout(resetAll, 2500);
      }
    }, 8000);

    form.submit();
    // Clear so it cannot be posted again
    setTimeout(function () { try { $('postPayload').value = ''; } catch (e) {} }, 300);
    return true;
  }

  function send(){
    if (alreadySent || hasSubmitted || awaitingPost) {
      showErr('పంపబడింది');
      return;
    }
    if (!audioBlob){ showErr('ముందు మాట్లాడండి.'); return; }

    alreadySent = true;
    setSendEnabled(false);
    try { $('player').pause(); } catch (e) {}

    var blob = audioBlob;
    var reqId = newRequestId();
    blobToBase64(blob).then(function (b64) {
      if (hasSubmitted) {
        showErr('పంపబడింది');
        return;
      }
      submit({
        name: ($('name').value || '').trim(),
        message: ($('message').value || '').trim(),
        audioBase64: b64,
        audioMime: audioMime,
        durationSec: durSec,
        source: 'web',
        requestId: reqId
      });
    }).catch(function () {
      alreadySent = false;
      hasSubmitted = false;
      setSendEnabled(true);
      show('step-review');
      showErr('మళ్ళీ ప్రయత్నించండి.');
    });
  }

  function sendText(){
    if (alreadySent || hasSubmitted || awaitingPost) {
      showErr('పంపబడింది');
      return;
    }
    var name = ($('name').value || '').trim();
    var message = ($('message').value || '').trim();
    if (!name && !message){
      showErr('ఏదైనా రాయండి.');
      return;
    }

    // Block the SAME typed request from being sent twice.
    var sig = textSignature(name, message);
    if (sentTexts[sig]){
      showErr('పంపబడింది');
      return;
    }

    alreadySent = true;
    setSendEnabled(false);
    var ok = submit({
      name: name,
      message: message,
      audioBase64: '',
      audioMime: '',
      durationSec: 0,
      source: 'web',
      requestId: newRequestId()
    });
    if (ok){
      sentTexts[sig] = true;
      saveSentTexts();
    } else {
      alreadySent = false;
      setSendEnabled(true);
    }
  }

  $('postFrame').addEventListener('load', function () {
    if (!awaitingPost) return;
    awaitingPost = false;
    if (postTimer) clearTimeout(postTimer);
    show('step-done');
    setTimeout(resetAll, 2500);
  });

  $('btn-record').addEventListener('click', startRecording);
  $('btn-stop').addEventListener('click', stopRecording);
  $('btn-again').addEventListener('click', resetAll);
  $('btn-send').addEventListener('click', send);
  $('btn-new').addEventListener('click', resetAll);
  $('btn-send-text').addEventListener('click', sendText);
  $('mic-help').addEventListener('click', function (ev) {
    ev.preventDefault();
    micHelp_({ name: 'NotAllowedError' });
  });

  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'microphone' }).then(function (st) {
      if (st.state === 'denied' && !isInAppBrowser()){
        showErr('మైక్రోఫోన్ బ్లాక్ అయింది. 🔒 → Allow');
      }
    }).catch(function () {});
  }
  // Gentle haptic tap on supported phones
  document.addEventListener('click', function () {
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }, true);
})();
</script>
</body>
</html>
